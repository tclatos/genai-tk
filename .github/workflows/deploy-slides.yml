name: Deploy Slides to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/slides-benchmark.md'
      - 'docs/theme/**'
      - '.github/workflows/deploy-slides.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Build All Slide Decks
        id: build_slides
        run: |
          if [ ! -d "docs/theme" ]; then
            echo "::notice::docs/theme not found in repository. Slides are maintained in the dedicated 'slides' repository. Skipping build."
            exit 0
          fi
          python3 scripts/build_slides.py

      - name: Check dist directory
        id: check_dist
        run: |
          if [ -d "dist" ] && [ -n "$(ls -A dist 2>/dev/null)" ]; then
            echo "has_dist=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_dist=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup GitHub Pages
        if: steps.check_dist.outputs.has_dist == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: steps.check_dist.outputs.has_dist == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        if: steps.check_dist.outputs.has_dist == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
