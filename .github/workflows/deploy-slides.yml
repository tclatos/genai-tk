name: Deploy Slides to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/slides-benchmark.md'
      - 'docs/theme/**'
      - '.github/workflows/deploy-slides.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'

      - name: Build All Slide Decks
        id: build_slides
        run: |
          if [ ! -d "docs/theme" ]; then
            echo "::notice::docs/theme not found in repository. Slides are maintained in the dedicated 'slides' repository. Skipping build."
            exit 0
          fi
          python3 scripts/build_slides.py

      - name: Check dist directory
        id: check_dist
        run: |
          if [ -d "dist" ] && [ -n "$(ls -A dist 2>/dev/null)" ]; then
            echo "has_dist=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_dist=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup GitHub Pages
        if: steps.check_dist.outputs.has_dist == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages Artifact
        if: steps.check_dist.outputs.has_dist == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - name: Deploy to GitHub Pages
        if: steps.check_dist.outputs.has_dist == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
