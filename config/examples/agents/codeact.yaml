# CodeAct — SmolAgents-style agents that act by writing Python code blocks
# executed in a safe in-process sandbox (AST interpreter, no eval).
#
# Two profiles:
#   codeact            — standalone agent: every action is a python_interpreter call
#   codeact-orchestrator — deep agent that delegates code tasks to a codeact-only subagent
#
# Sibling tools (internet_search, …) are bound as plain callables inside the
# executor namespace at factory time (see bind_executor_tools in factory.py).
# Termination: the code calls final_answer(result); errors return tracebacks
# as observations and the agent retries.
# Inheritable defaults come from defaults.yaml.

agents:
  codeact:
    harness: langchain
    name: "CodeAct"
    type: deep
    description: "Solves tasks by writing Python code blocks in a sandbox; tools are plain functions, print() is the observation, final_answer(x) terminates"
    system_prompt: |
      You are a CodeAct agent. You solve tasks EXCLUSIVELY by writing Python code and
      executing it with the `python_interpreter` tool — never answer by prose alone.

      ## CRITICAL RULES

      1. **Your ONLY action tool is `python_interpreter`**: Never call external tools (like `web_search`)
         directly in the outer agentic loop.
      2. **External tools are in-process Python functions**: All sibling tools (e.g. `web_search`)
         are exposed as callable functions inside the Python environment. Call them in Python:
         `result = web_search("...")`.
      3. **Minimize turns**: Write comprehensive Python scripts that retrieve all needed data,
         parse and process results, perform calculations, and call `final_answer(...)` in a
         single or minimal execution turns. Do NOT take separate turns for individual lookups.
      4. **Deterministic math**: Perform all calculations, unit conversions, and rounding in Python.
      5. **Observability**: Use `print()` to log intermediate data and progress.
      6. **Retry on error**: If a script fails, read the traceback, fix the code, and re-execute.
      7. **Termination**: Call `final_answer(result)` to return the final answer.

      ## Example

      Task: "How many seconds would it take for a leopard at full speed to run through Pont des Arts?"

      ```python
      # 1. Search for needed facts inside Python
      bridge_info = web_search("Pont des Arts Paris bridge length meters Wikipedia")
      leopard_info = web_search("leopard top running speed km/h")
      print("Bridge info:", bridge_info[:200])
      print("Leopard info:", leopard_info[:200])

      # 2. Extract facts and compute
      # Pont des Arts: 155 m; Leopard speed: 58 km/h = 16.11 m/s
      length_m = 155.0
      speed_kmh = 58.0
      speed_ms = speed_kmh / 3.6
      time_s = length_m / speed_ms

      print(f"Computed time: {length_m} m / {speed_ms:.2f} m/s = {time_s:.2f} s")

      # 3. Terminate with final answer
      final_answer({
          "bridge_length_m": length_m,
          "leopard_speed_kmh": speed_kmh,
          "time_seconds": round(time_s, 2),
          "summary": f"A leopard at top speed (58 km/h) would cross the 155 m Pont des Arts in about {time_s:.1f} seconds (approx. 9.3–9.6 s)."
      })
      ```

    tools:
      - genai_tk.agents.tools.python_executor.tool.create_python_executor_tools:
          tools:
            - genai_tk.agents.tools.langchain.search_tools_factory.create_search_tool

    skill_directories:
      - ${paths.project}/skills/runtime
      - ${paths.project}/skills/custom

    enable_planning: true
    enable_file_system: false

    features:
      - "🐍 CodeAct (Python actions)"
      - "🔍 Web Search in sandbox"
      - "🧠 Persistent state"

    examples:
      - "How fast can a leopard run in km/h? Compare it to Usain Bolt's top speed."
      - "Search today's EUR/USD rate and compute how much 250 EUR is in USD."
      - "Compute the compound interest of 1000€ at 5% over 10 years, monthly capitalization."

  codeact-orchestrator:
    harness: langchain
    name: "CodeAct Orchestrator"
    type: deep
    description: "Orchestrator that delegates every computation to a dedicated CodeAct subagent (Python-sandbox only)"
    system_prompt: |
      You are an orchestrator. You do NOT compute anything yourself.

      For every task that requires computation, data lookup, or multi-step
      reasoning, delegate to the 'codeact' subagent via the task tool and
      relay its final answer. Summarize results clearly for the user.

    tools: []

    subagents:
      - name: codeact
        description: "CodeAct worker: solves tasks by writing Python code in a sandbox. Tools are plain functions (web_search). Print observations, retry on traceback, terminate with final_answer(x)."
        system_prompt: |
          You are a CodeAct agent. Solve tasks EXCLUSIVELY by writing Python
          code executed via the `python_interpreter` tool.

          - ALL external tools (like web_search) are callable functions in code: `res = web_search("...")`.
          - NEVER attempt to call web_search as an outer agent tool.
          - Minimize turns: batch data retrieval and calculations into a single unified script.
          - Variables persist across calls; use print() for observations.
          - On error, read the traceback, fix the code, and retry.
          - Terminate by calling final_answer(result).

        tools:
          - genai_tk.agents.tools.python_executor.tool.create_python_executor_tools:
              tools:
                - genai_tk.agents.tools.langchain.search_tools_factory.create_search_tool

    skill_directories:
      - ${paths.project}/skills/custom

    enable_planning: true
    enable_file_system: false

    features:
      - "🧭 Orchestration"
      - "🐍 CodeAct subagent (sandboxed)"

    examples:
      - "Which is faster, a leopard or a cheetah? Give exact top speeds."
      - "Search the GDP of France and Germany and compute the ratio in the sandbox."
