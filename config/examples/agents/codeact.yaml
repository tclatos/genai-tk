# CodeAct — SmolAgents-style agents that act by writing Python code blocks
# executed in a safe in-process sandbox (AST interpreter, no eval).
#
# Two profiles:
#   codeact            — standalone agent: every action is a python_interpreter call
#   codeact-orchestrator — deep agent that delegates code tasks to a codeact-only subagent
#
# Sibling tools (internet_search, …) are bound as plain callables inside the
# executor namespace at factory time (see bind_executor_tools in factory.py).
# Termination: the code calls final_answer(result); errors return tracebacks
# as observations and the agent retries.
# Inheritable defaults come from defaults.yaml.

agents:
  codeact:
    harness: langchain
    name: "CodeAct"
    type: deep
    description: "Solves tasks by writing Python code blocks in a sandbox; tools are plain functions, print() is the observation, final_answer(x) terminates"
    system_prompt: |
      You are a CodeAct agent. You solve tasks by writing Python code and
      executing it with the python_interpreter tool — never answer by prose alone.

      ## Protocol

      1. Think about the next single step, then express it as a short Python code block.
      2. Call python_interpreter with that code. Variables persist between calls.
      3. Tools available in your profile (e.g. web_search) are plain functions
         inside the sandbox: call them directly, e.g. `result = web_search("...")`.
      4. Observe: print() output and the last expression value come back as the result.
      5. If the result is an Error/traceback, fix the code and retry — do not give up.
      6. When the task is solved, call final_answer(value) with the final result.

      ## Rules

      - Use print() to surface intermediate observations; keep each step small.
      - State persists: define helper functions and variables once, reuse them.
      - Available imports: math, json, datetime, itertools, re, collections,
        statistics, random, and other safe stdlib modules.
      - Never fabricate data: if a fact is unknown, look it up with a tool.
      - Call final_answer(...) exactly once, at the end.

      ## Example

      Task: "How many seconds are in 3 hours?"

      ```python
      seconds = 3 * 60 * 60
      print(f"3 hours = {seconds} seconds")
      final_answer(seconds)
      ```

    tools:
      - factory: genai_tk.agents.tools.python_executor.tool.create_python_executor_tools
      - factory: genai_tk.agents.tools.langchain.search_tools_factory.create_search_tool

    skill_directories:
      - ${paths.project}/skills/custom

    enable_planning: true
    enable_file_system: false

    features:
      - "🐍 CodeAct (Python actions)"
      - "🔍 Web Search in sandbox"
      - "🧠 Persistent state"

    examples:
      - "How fast can a leopard run in km/h? Compare it to Usain Bolt's top speed."
      - "Search today's EUR/USD rate and compute how much 250 EUR is in USD."
      - "Compute the compound interest of 1000€ at 5% over 10 years, monthly capitalization."

  codeact-orchestrator:
    harness: langchain
    name: "CodeAct Orchestrator"
    type: deep
    description: "Orchestrator that delegates every computation to a dedicated CodeAct subagent (Python-sandbox only)"
    system_prompt: |
      You are an orchestrator. You do NOT compute anything yourself.

      For every task that requires computation, data lookup, or multi-step
      reasoning, delegate to the 'codeact' subagent via the task tool and
      relay its final answer. Summarize results clearly for the user.

    tools: []

    subagents:
      - name: codeact
        description: "CodeAct worker: solves tasks by writing Python code in a sandbox. Tools are plain functions (web_search). Print observations, retry on traceback, terminate with final_answer(x)."
        system_prompt: |
          You are a CodeAct agent. Solve tasks exclusively by writing Python
          code executed via the python_interpreter tool.

          - web_search(...) is available as a plain function in the sandbox.
          - Variables persist across calls; use print() for observations.
          - On error, read the traceback, fix the code, and retry.
          - Terminate by calling final_answer(result).

        tools:
          - factory: genai_tk.agents.tools.python_executor.tool.create_python_executor_tools
          - factory: genai_tk.agents.tools.langchain.search_tools_factory.create_search_tool

    skill_directories:
      - ${paths.project}/skills/custom

    enable_planning: true
    enable_file_system: false

    features:
      - "🧭 Orchestration"
      - "🐍 CodeAct subagent (sandboxed)"

    examples:
      - "Which is faster, a leopard or a cheetah? Give exact top speeds."
      - "Search the GDP of France and Germany and compute the ratio in the sandbox."
